server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/metal_system?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowMultiQueries=true
    username: root
    password: ly123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.metal.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# 短信配置（阿里云短信验证码登录）
sms:
  access-key-id: ${SMS_ACCESS_KEY_ID}
  access-key-secret: ${SMS_ACCESS_KEY_SECRET}
  sign-name: ${SMS_SIGN_NAME}
  template-code: ${SMS_TEMPLATE_CODE}

# OCR 配置（通义千问 Qwen3.5-OCR）
ocr:
  dashscope:
    api-key: ${OCR_DASHSCOPE_API_KEY}

pagehelper:
  helper-dialect: mysql
  reasonable: false
  support-methods-arguments: true
  params: count=countSql
  page-size-zero: true

# JWT 配置
app:
  jwt:
    secret: metal-system-jwt-secret-key-2026-very-long-secret-key-for-hs256
    expiration-ms: 86400000  # 24 hours